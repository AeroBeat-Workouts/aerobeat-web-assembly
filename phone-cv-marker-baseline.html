<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AeroBeat · Camera CV marker baseline</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06141f;color:#fff;font:600 14px/1.4 system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column}.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#101923}.stage video{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.marker{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border:3px solid white;border-radius:50%;box-shadow:0 0 0 2px #000b,0 0 10px #000;pointer-events:none}.marker[hidden]{display:none}.marker[data-role="left"]{background:#19aff3}.marker[data-role="right"]{background:#fd6a97}.marker[data-role="nose"]{width:12px;height:12px;margin:-6px 0 0 -6px;background:#ffde74}.marker[data-held="true"]{opacity:.5}aside{flex:none;height:min(190px,40dvh);overflow-y:auto;padding:10px max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom));background:#071820;border-top:1px solid #8ae8ed}output{display:block;min-height:20px}#state{color:#ffde83}#summary{font-size:12px;color:#b7d9df}button{min-height:44px;min-width:160px;margin:8px 8px 0 0;border:1px solid #9becfa;border-radius:7px;background:#124050;color:white;font:700 14px system-ui;touch-action:manipulation}button:disabled{opacity:.5}
</style></head><body><main><div class="stage" id="stage"><video id="camera" autoplay muted playsinline aria-label="Mirrored live camera"></video><span class="marker" data-role="left" hidden aria-hidden="true"></span><span class="marker" data-role="right" hidden aria-hidden="true"></span><span class="marker" data-role="nose" hidden aria-hidden="true"></span></div><aside aria-label="Private camera and CV marker baseline"><strong>Camera + CV markers only · no game</strong><output id="state" role="status">Camera not ready.</output><output id="summary">Allow the camera, hold a T-pose until calibrated, then release your arms.</output><button id="start" disabled type="button">Measure (60 seconds)</button><button id="download" disabled hidden type="button">Download private JSON</button></aside></main><script type="module" src="/src/phone-cv-marker-baseline.js"></script></body></html>
