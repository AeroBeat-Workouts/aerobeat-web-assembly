<!doctype html><html><head><meta charset="utf-8"><title>AeroBeat — Y2K early-CG comp</title>

<body><canvas id="c"></canvas>
<script type="module">
import * as pc from '../_shared/playcanvas.min.mjs';
import { createHands } from '../_shared/hands.mjs';
import { content, coverUrl } from '../_shared/content.mjs';

window.__compReady = false;

// ---------------------------------------------------------------- palette
const C = {
  cobalt: '#1E2C9E', ink: '#0D1460', peri: '#8FA6FF', haze: '#FFE4D8',
  poolA: '#0E5D8C', poolB: '#1C82B4', white: '#F5F8FF', topaz: '#FFB21E',
  ruby: '#F0325C', emerald: '#19C98A', amethyst: '#A65BFF',

const col = (hex, a = 1) => { const n = parseInt(hex.slice(1), 16); return new pc.Color(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255, a); };

app.scene.fog.end = 95;
app.start();
window.__app = app;
app.scene.layers.getLayerByName('World').opaqueSortMode = pc.SORTMODE_FRONT2BACK;

const FOV = 40, CAM_Z = 10;
const cam = new pc.Entity('cam');

const sun = new pc.Entity('sun');

sun.setEulerAngles(48, 38, 0);
app.root.addChild(sun);
const rim = new pc.Entity('rim');
rim.addComponent('light', { type: 'directional', color: col('#9FB2FF'), intensity: 0.45 });
rim.setEulerAngles(-30, -140, 0);
app.root.addChild(rim);

const hands = createHands(app, cam);

// Layout is authored in 1600x1000 screen pixels on the z=0 plane.
const K = 2 * CAM_Z * Math.tan(FOV / 2 * Math.PI / 180) / 1000; // world units per px at z=0
const S = (px) => px * K;

// ---------------------------------------------------------------- helpers
const SC = 2; // canvas supersampling for text
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
function tex(cv, { repeat = false, srgb = true, mips = true } = {}) {

    mipmaps: mips, minFilter: mips ? pc.FILTER_LINEAR_MIPMAP_LINEAR : pc.FILTER_LINEAR, magFilter: pc.FILTER_LINEAR, anisotropy: 1,
    addressU: repeat ? pc.ADDRESS_REPEAT : pc.ADDRESS_CLAMP_TO_EDGE, addressV: repeat ? pc.ADDRESS_REPEAT : pc.ADDRESS_CLAMP_TO_EDGE,
  });

}

  m.diffuse = new pc.Color(0, 0, 0); m.emissive = new pc.Color(1, 1, 1); m.emissiveMap = t;
  if (alpha) {

  m.update();

}
function quad(parent, w, h, mat, name = 'quad') {
  const e = new pc.Entity(name);
  e.addComponent('render', { type: 'plane', castShadows: false, receiveShadows: false });
  e.render.meshInstances[0].material = mat;
  e.setLocalEulerAngles(90, 0, 0);
  e.setLocalScale(w, 1, h);
  parent.addChild(e);
  return e;
}
function spinQuad(parent, w, h, mat, name = 'spin') {
  const pivot = new pc.Entity(name); parent.addChild(pivot);
  const q = quad(pivot, w, h, mat, name + '-q');
  pivot.q = q; return pivot;
}
function prim(parent, type, mat, name = type) {
  const e = new pc.Entity(name);
  e.addComponent('render', { type, castShadows: false, receiveShadows: false });
  e.render.meshInstances[0].material = mat;
  parent.addChild(e);
  return e;
}
function meshEntity(parent, mesh, mat, name) {
  const e = new pc.Entity(name);
  e.addComponent('render', { meshInstances: [new pc.MeshInstance(mesh, mat)], castShadows: false });
  parent.addChild(e);
  return e;
}
const easeOut = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const easeInOut = (t) => { t = Math.min(1, Math.max(0, t)); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- assets
async function loadFont(family, url, descriptors) {
  const buf = await (await fetch(url)).arrayBuffer();
  const f = new FontFace(family, buf, descriptors);
  await f.load(); document.fonts.add(f);
}
function loadImage(path) {
  return new Promise((ok) => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => ok(img);
    img.onerror = () => { console.warn('cover failed', path); ok(null); };
    img.src = coverUrl(path);
  });
}

// ---------------------------------------------------------------- procedural textures
// The one environment every reflective surface shares: a sphere map, i.e. the
// exact cheap trick 90s renderers used for "chrome". Cobalt sky, a hard white
// horizon line, warm ground, two studio-window highlights.
function chromeSphereCanvas() {
  const n = 512, cv = mkCanvas(n, n), g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, n);
  gr.addColorStop(0.00, '#0A1150'); gr.addColorStop(0.22, '#1E2C9E'); gr.addColorStop(0.40, '#6F86F2');
  gr.addColorStop(0.485, '#E6ECFF'); gr.addColorStop(0.50, '#FFFFFF'); gr.addColorStop(0.512, '#FFE4D8');
  gr.addColorStop(0.53, '#5A3C5E'); gr.addColorStop(0.62, '#1C82B4'); gr.addColorStop(0.80, '#0E5D8C'); gr.addColorStop(1, '#041C30');
  g.fillStyle = gr; g.fillRect(0, 0, n, n);
  const blob = (x, y, rx, ry, a) => { g.save(); g.translate(x, y); g.scale(rx, ry); const r = g.createRadialGradient(0, 0, 0, 0, 0, 1); r.addColorStop(0, `rgba(255,255,255,${a})`); r.addColorStop(0.6, `rgba(255,255,255,${a * 0.5})`); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill(); g.restore(); };
  blob(360, 130, 70, 42, 0.95); blob(150, 170, 40, 26, 0.55); blob(256, 420, 120, 18, 0.25);
  return cv;
}
function skyCanvas() {
  // Maps onto a 240x130 world plane at z=-150; the horizon is the middle row.
  const w = 1024, h = 1024, cv = mkCanvas(w, h), g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0.00, '#101A7A'); gr.addColorStop(0.12, '#1E2C9E'); gr.addColorStop(0.28, '#3F58D6');
  gr.addColorStop(0.40, '#8FA6FF'); gr.addColorStop(0.47, '#D8DEFF'); gr.addColorStop(0.50, '#FFE4D8');
  gr.addColorStop(0.54, '#F4DCE0'); gr.addColorStop(0.62, '#9CC4E4'); gr.addColorStop(1, '#3A86BA');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  // airbrushed cirrus
  g.save(); g.filter = 'blur(10px)';
  const streak = (x, y, len, th, a) => { g.save(); g.translate(x, y); g.rotate(-0.06); g.scale(len, th); const r = g.createRadialGradient(0, 0, 0, 0, 0, 1); r.addColorStop(0, `rgba(255,245,250,${a})`); r.addColorStop(1, 'rgba(255,245,250,0)'); g.fillStyle = r; g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill(); g.restore(); };
  streak(700, 330, 260, 10, 0.35); streak(820, 360, 180, 7, 0.3); streak(560, 395, 300, 9, 0.28);
  streak(860, 420, 220, 8, 0.32); streak(300, 300, 240, 9, 0.22); streak(640, 440, 330, 7, 0.35);
  g.restore();
  // distant fractal ridge, swallowed by the horizon fog the way Bryce did it
  const ridge = (seed, base, amp, colTop, colBot) => {
    let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const pts = new Array(257).fill(0);
    const md = (a, b, d) => { if (b - a < 2) return; const m = (a + b) >> 1; pts[m] = (pts[a] + pts[b]) / 2 + (rnd() - 0.5) * d; md(a, m, d * 0.55); md(m, b, d * 0.55); };
    pts[0] = rnd() * amp * 0.4; pts[256] = rnd() * amp * 0.4; md(0, 256, amp);
    const rg = g.createLinearGradient(0, base - amp, 0, base);
    rg.addColorStop(0, colTop); rg.addColorStop(1, colBot);
    g.fillStyle = rg; g.beginPath(); g.moveTo(0, base);
    for (let i = 0; i <= 256; i++) g.lineTo(i / 256 * w, base - Math.max(0, pts[i] + amp * 0.35));
    g.lineTo(w, base); g.closePath(); g.fill();
  };
  ridge(11, 514, 34, 'rgba(160,150,214,0.85)', 'rgba(255,228,216,1)');
  ridge(97, 516, 20, 'rgba(198,176,214,0.9)', 'rgba(255,228,216,1)');
  // fog band across the horizon
  const fb = g.createLinearGradient(0, 488, 0, 540);
  fb.addColorStop(0, 'rgba(255,228,216,0)'); fb.addColorStop(0.45, 'rgba(255,236,226,0.9)'); fb.addColorStop(1, 'rgba(255,228,216,0)');
  g.fillStyle = fb; g.fillRect(0, 488, w, 52);
  return cv;
}
function slabCanvas() {
  const w = 512, h = 320, cv = mkCanvas(w, h), g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#1A2690'); gr.addColorStop(0.45, '#3A52D0'); gr.addColorStop(0.75, '#6E86EE'); gr.addColorStop(0.9, '#C9CCF4'); gr.addColorStop(1, '#F2DCE0');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  // diagonal "glass" sheen bands
  g.save(); g.globalCompositeOperation = 'lighter';
  const band = (x, wd, a) => { const lg = g.createLinearGradient(x, 0, x + wd, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, `rgba(190,205,255,${a})`); lg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = lg; g.save(); g.transform(1, 0, -0.55, 1, 0, 0); g.fillRect(x, 0, wd, h); g.restore(); };
  band(260, 90, 0.18); band(380, 26, 0.22); band(470, 60, 0.12);
  g.restore();
  return cv;
}
function checkerCanvas() {
  const n = 256, cv = mkCanvas(n, n), g = cv.getContext('2d');
  g.fillStyle = C.poolA; g.fillRect(0, 0, n, n);
  g.fillStyle = C.poolB; g.fillRect(0, 0, n / 2, n / 2); g.fillRect(n / 2, n / 2, n / 2, n / 2);
  g.strokeStyle = 'rgba(190,232,255,0.35)'; g.lineWidth = 3;
  g.strokeRect(1.5, 1.5, n / 2 - 3, n / 2 - 3); g.strokeRect(n / 2 + 1.5, 1.5, n / 2 - 3, n / 2 - 3);
  g.strokeRect(1.5, n / 2 + 1.5, n / 2 - 3, n / 2 - 3); g.strokeRect(n / 2 + 1.5, n / 2 + 1.5, n / 2 - 3, n / 2 - 3);
  return cv;
}
function planetCanvas() {
  const w = 512, h = 256, cv = mkCanvas(w, h), g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, h);
  const bands = ['#E9D6F2', '#F6E3DA', '#CDB8EE', '#F9EADF', '#D9C3EC', '#EED6E2', '#C6B2E8', '#F3E2DC'];
  bands.forEach((c, i) => gr.addColorStop(i / (bands.length - 1), c));
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.globalAlpha = 0.25; g.filter = 'blur(3px)';
  for (let i = 0; i < 14; i++) { g.fillStyle = i % 2 ? '#B9A2E0' : '#FFF1E6'; g.fillRect(0, 20 + i * 16 + Math.sin(i) * 5, w, 4 + (i % 3) * 2); }
  return cv;
}
function radialCanvas(stops, n = 256) {
  const cv = mkCanvas(n, n), g = cv.getContext('2d');
  const r = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
  for (const [o, c] of stops) r.addColorStop(o, c);
  g.fillStyle = r; g.fillRect(0, 0, n, n);
  return cv;
}
// four-point star glint
function sparkleCanvas({ core = '#FFFFFF', tint = 'rgba(255,255,255,', ring = null, n = 256 } = {}) {
  const cv = mkCanvas(n, n), g = cv.getContext('2d'), c = n / 2;
  if (ring) { // wrist marker: ink-white-ink ring, legible on haze, sky and chrome
    g.lineWidth = n * 0.13; g.strokeStyle = ring.outer; g.beginPath(); g.arc(c, c, n * 0.34, 0, Math.PI * 2); g.stroke();
    g.lineWidth = n * 0.07; g.strokeStyle = ring.inner; g.beginPath(); g.arc(c, c, n * 0.34, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(13,20,96,0.35)'; g.beginPath(); g.arc(c, c, n * 0.27, 0, Math.PI * 2); g.fill();
  }
  const spike = (len, th, rot) => {
    g.save(); g.translate(c, c); g.rotate(rot);
    const lg = g.createLinearGradient(-len, 0, len, 0);
    lg.addColorStop(0, tint + '0)'); lg.addColorStop(0.5, tint + '1)'); lg.addColorStop(1, tint + '0)');
    g.fillStyle = lg; g.beginPath(); g.moveTo(-len, 0); g.lineTo(0, -th); g.lineTo(len, 0); g.lineTo(0, th); g.closePath(); g.fill(); g.restore();
  };
  if (ring) { g.save(); g.shadowColor = ring.outer; g.shadowBlur = n * 0.06; }
  spike(n * 0.47, n * 0.06, 0); spike(n * 0.47, n * 0.06, Math.PI / 2);
  spike(n * 0.22, n * 0.035, Math.PI / 4); spike(n * 0.22, n * 0.035, -Math.PI / 4);
  if (ring) g.restore();
  const r = g.createRadialGradient(c, c, 0, c, c, n * 0.16);
  r.addColorStop(0, core); r.addColorStop(1, tint + '0)');
  g.fillStyle = r; g.beginPath(); g.arc(c, c, n * 0.16, 0, Math.PI * 2); g.fill();
  return cv;
}
function raysCanvas(n = 512) {
  const cv = mkCanvas(n, n), g = cv.getContext('2d'), c = n / 2;
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 48; i++) {
    const a = rnd() * Math.PI * 2, len = c * (0.35 + rnd() * 0.65), th = 1 + rnd() * 2.5;
    g.save(); g.translate(c, c); g.rotate(a);
    const lg = g.createLinearGradient(0, 0, len, 0);
    lg.addColorStop(0, 'rgba(255,240,210,0.9)'); lg.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = lg; g.beginPath(); g.moveTo(0, -th); g.lineTo(len, 0); g.lineTo(0, th); g.fill(); g.restore();
  }
  return cv;
}
function ghostCanvas(kind, hue, n = 256) {
  const cv = mkCanvas(n, n), g = cv.getContext('2d'), c = n / 2;
  if (kind === 'ring') {
    const r = g.createRadialGradient(c, c, n * 0.28, c, c, n * 0.48);
    r.addColorStop(0, `hsla(${hue},100%,70%,0)`); r.addColorStop(0.5, `hsla(${hue},100%,72%,0.7)`); r.addColorStop(1, `hsla(${hue},100%,70%,0)`);
    g.fillStyle = r; g.fillRect(0, 0, n, n);
  } else {
    g.fillStyle = `hsla(${hue},90%,72%,0.32)`; g.strokeStyle = `hsla(${hue},100%,85%,0.55)`; g.lineWidth = 4;
    g.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + Math.PI / 6; g[i ? 'lineTo' : 'moveTo'](c + Math.cos(a) * n * 0.44, c + Math.sin(a) * n * 0.44); } g.closePath(); g.fill(); g.stroke();
  }
  return cv;
}
function streakCanvas() {
  const w = 1024, h = 64, cv = mkCanvas(w, h), g = cv.getContext('2d');
  g.save(); g.translate(w / 2, h / 2); g.scale(w / 2, h / 2);
  const r = g.createRadialGradient(0, 0, 0, 0, 0, 1);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.15, 'rgba(170,215,255,0.8)'); r.addColorStop(0.6, 'rgba(90,140,255,0.25)'); r.addColorStop(1, 'rgba(60,90,255,0)');
  g.fillStyle = r; g.beginPath(); g.arc(0, 0, 1, 0, Math.PI * 2); g.fill(); g.restore();
  return cv;
}

// Text drawn into a canvas, shown on a plane. Returns entity plus size in px.
function textBlock(parent, { lines, family = 'Jost', size, weight = 500, color = C.white, chrome = false, align = 'left',
  lineH = 1.12, halo = C.ink, tracking = 0 }) {
  const font = `${weight} ${size * SC}px "${family}"`;
  const m = mkCanvas(4, 4).getContext('2d'); m.font = font;
  if (tracking) m.letterSpacing = `${tracking * SC}px`;
  const widths = lines.map((l) => m.measureText(l).width / SC);
  const pad = Math.round(size * 0.35);
  const wpx = Math.max(...widths) + pad * 2, hpx = lines.length * size * lineH + pad * 2;
  const cv = mkCanvas(wpx * SC, hpx * SC), g = cv.getContext('2d');
  g.font = font; g.textBaseline = 'middle'; g.lineJoin = 'round';
  if (tracking) g.letterSpacing = `${tracking * SC}px`;
  lines.forEach((line, i) => {
    const lw = widths[i];
    const x = (align === 'left' ? pad : align === 'right' ? wpx - pad - lw : (wpx - lw) / 2) * SC;
    const yc = (pad + size * lineH * (i + 0.5)) * SC;
    if (chrome) {
      // classic airbrushed chrome lettering: sky top, hard horizon line, warm ground.
      const top = yc - size * 0.42 * SC, bot = yc + size * 0.42 * SC;
      g.save(); g.shadowColor = 'rgba(8,12,70,0.65)'; g.shadowBlur = size * 0.25 * SC; g.shadowOffsetY = size * 0.06 * SC;
      g.lineWidth = size * 0.16 * SC; g.strokeStyle = C.ink; g.strokeText(line, x, yc); g.restore();
      const gr = g.createLinearGradient(0, top, 0, bot);
      gr.addColorStop(0, '#2A3CC4'); gr.addColorStop(0.28, '#9DB2FF'); gr.addColorStop(0.49, '#FFFFFF');
      gr.addColorStop(0.505, '#7A4A3A'); gr.addColorStop(0.62, '#C47F4F'); gr.addColorStop(0.85, '#FFD7A8'); gr.addColorStop(1, '#FFF4E4');
      g.fillStyle = gr; g.fillText(line, x, yc);
      g.lineWidth = size * 0.025 * SC; g.strokeStyle = 'rgba(255,255,255,0.75)'; g.strokeText(line, x, yc);
    } else {
      g.save(); g.shadowColor = 'rgba(8,12,70,0.55)'; g.shadowBlur = size * 0.3 * SC;
      g.lineWidth = size * 0.14 * SC; g.strokeStyle = halo; g.strokeText(line, x, yc); g.restore();
      g.fillStyle = color; g.fillText(line, x, yc);
    }
  });
  const e = quad(parent, S(wpx), S(hpx), unlit(tex(cv)), 'text');
  return { e, wpx, hpx, pad };
}
// place a text block: x,y are the px position of its anchor (left/centre of first line's box top)
function placeText(tb, ux, uy, x, y, z = 0.03, anchor = 'left') {
  const cx = anchor === 'left' ? x - tb.pad + tb.wpx / 2 : x;
  const cy = y - tb.pad + tb.hpx / 2;
  tb.e.setLocalPosition(S(cx - ux), S(uy - cy), z);
}

// Faceted gem (brilliant-ish), flat shaded, table facing +Z.
function gemMesh() {
  const N = 8, girdle = [], table = [], P = [], Nn = [], U = [], I = [];
  for (let i = 0; i < N; i++) { const a = i / N * Math.PI * 2 + Math.PI / 8; girdle.push([Math.cos(a), Math.sin(a), 0]); table.push([0.55 * Math.cos(a), 0.55 * Math.sin(a), 0.4]); }
  const top = [0, 0, 0.42], culet = [0, 0, -0.85];
  const tri = (a, b, c) => {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    for (const p of [a, b, c]) { I.push(P.length / 3); P.push(...p); Nn.push(nx, ny, nz); U.push(p[0] * 0.5 + 0.5, p[1] * 0.5 + 0.5); }
  };
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    tri(top, table[i], table[j]);
    tri(table[i], girdle[i], girdle[j]); tri(table[i], girdle[j], table[j]);
    tri(girdle[j], girdle[i], culet);
  }
  const geom = new pc.Geometry(); geom.positions = P; geom.normals = Nn; geom.uvs = U; geom.indices = I;
  return pc.Mesh.fromGeometry(app.graphicsDevice, geom);
}

// ---------------------------------------------------------------- build
async function build() {
  await Promise.all([

  // ---- frame loop --------------------------------------------------------
  app.on('update', (dt) => {
    time += dt;
    const hs = heroSel ? time - heroSel.t0 : -1;
    // forward 0..HOLD_T, then return
    const HOLD_T = 4.2, BACK_T = 0.9;
    let tr = 0; // 0 = home, 1 = into playlist
    const charging = heroSel && hs < 0;
    if (heroSel && hs >= 0) {
      tr = hs < HOLD_T ? easeOut(hs / 1.1) : 1 - easeInOut((hs - HOLD_T) / BACK_T);
      if (hs > HOLD_T + BACK_T) { heroSel = null; tr = 0; }
    }

    for (const u of Object.values(units)) {
      const big = u.name === 'hero' ? 0.35 : 1;
      const target = ((u.hover ? 0.28 : 0) + (u.arm > 0 ? 0.1 : 0)) * big;
      u.lift += (target - u.lift) * Math.min(1, dt * 9);
      const bob = reduceMotion ? 0 : Math.sin(time * 1.2 + u.phase) * (u.bobAmp ?? S(2));
      const keep = (CAM_Z - u.lift) / CAM_Z; // grow toward the athlete without sliding sideways
      let x = u.home.x * keep, y = (u.home.y + bob) * keep, z = u.home.z + u.lift, sc = 1;
      if (u.name === 'hero') {
        // fly toward the athlete and settle as the head of the playlist screen
        x = lerp(x, 0, tr); y = lerp(y, S(500 - 318) * (CAM_Z - 2.3) / CAM_Z, tr); z = lerp(z, 2.3, tr);
        u.unit.setLocalEulerAngles(lerp(0, 6, Math.sin(Math.min(1, tr) * Math.PI)), lerp(0, 14, Math.sin(Math.min(1, tr) * Math.PI)), 0);
      } else if (tr > 0) {
        // everything else sinks into the horizon fog
        const k = easeInOut(tr * 1.15);
        y -= k * 5.5; z -= k * 10; sc = 1 - 0.3 * k;
      }
      // selection pulse for non-hero targets
      const ft = time - u.flashT;
      if (u.name !== 'hero' && ft < 0.5) sc *= 1 + 0.07 * Math.sin(Math.PI * ft / 0.5);
      u.unit.setLocalPosition(x, y, z);
      u.unit.setLocalScale(sc, sc, sc);

      // gem ring
      const charge = u.name === 'hero' && charging;
      const showGems = u.hover || u.arm > 0 || (ft > -1 && ft < 0.7);
      const N = u.gems.length, litN = charge ? N : u.arm > 0 ? Math.min(N, Math.ceil(u.arm * N)) : 0;
      u.gems.forEach((gm, i) => {
        gm.g.enabled = showGems && !(u.name === 'hero' && tr > 0.05 && ft > 0.7);
        if (!gm.g.enabled) return;
        const flashing = ft >= 0 && ft < 0.7;
        const lit = i < litN;
        if (lit && gm.litAt < 0) gm.litAt = time;
        if (!lit) gm.litAt = -1;
        const mi = gm.body.render.meshInstances[0];
        mi.material = flashing ? M.gemFlash : lit ? M.gemLit : M.gemIdle;
        gm.halo.enabled = lit || flashing;
        const pop = lit ? 1 + 0.7 * Math.max(0, 1 - (time - gm.litAt) / 0.18) : 1;
        const fl = flashing ? 1 + 0.5 * Math.max(0, 1 - ft / 0.7) : charge ? 1.15 + 0.25 * (1 + hs / CHARGE) : 1;
        gm.g.setLocalScale(pop * fl, pop * fl, pop * fl);
        gm.spin += dt * (charge ? 360 : lit ? 90 : 25);
        gm.body.setLocalEulerAngles(0, 0, gm.spin);
      });
      // glint
      if (u.glint) {
        const on = u.hover || u.arm > 0 || (ft > -1 && ft < 0.7);
        u.glint.q.enabled = on && !(u.name === 'hero' && tr > 0.05);
        if (on) {
          const pulse = ft < 0 ? 1.4 + 1.2 * (1 + ft / CHARGE) : ft < 0.7 ? 2.6 - 1.6 * (ft / 0.7) : 0.85 + 0.15 * Math.sin(time * 3);
          u.glint.q.setLocalEulerAngles(0, 0, time * 40);
          u.glint.q.setLocalScale(pulse, pulse, pulse);
        }
      }
    }

    if (units.hero.cta) { const hu = units.hero, holding = !heroSel && hu.arm > 0;
      hu.cta.enabled = !heroSel && !holding; hu.holdTxt.enabled = holding || !!charging; hu.go.enabled = !!heroSel && !charging;
      window.__phase = !heroSel ? 'home' : hs < 0 ? 'charge' : 'flare'; }
    // arrivals: the playlist's songs float in from the haze
    arrivals.forEach((a) => {
      const k = heroSel && hs >= 0 ? easeOut((hs - 0.15 - a.i * 0.07) / 0.6) * (hs < HOLD_T ? 1 : tr) : 0;
      a.root.enabled = k > 0.001;
      if (!a.root.enabled) return;
      const tx = S(455 + a.i * 230 - 800) * (CAM_Z - 0.6) / CAM_Z, ty = S(500 - 790) * (CAM_Z - 0.6) / CAM_Z;
      a.root.setLocalPosition(lerp(tx + 6, tx, k), lerp(ty - 1.5, ty, k), lerp(-40, 0.6, k));
      a.root.setLocalEulerAngles(0, lerp(-60, -8, k), lerp(10, 0, k));
    });

    // lens flare
    let fa = 0;
    if (heroSel && hs >= 0) fa = hs < 0.1 ? hs / 0.1 : hs < 0.8 ? 1 : Math.exp(-(hs - 0.8) * 2.2);
    flareRoot.enabled = fa > 0.01;
    if (flareRoot.enabled) {
      // source rides the frame's top-right chrome sphere as it flies
      const src = units.hero.flareSrc.getPosition();
      const sp = cam.camera.worldToScreen(src);
      const W = app.graphicsDevice.width / (window.devicePixelRatio || 1), H = app.graphicsDevice.height / (window.devicePixelRatio || 1);
      const kd = K * FD / CAM_Z * (1000 / H);
      flareEls.forEach((el) => {
        const px = sp.x + (W / 2 - sp.x) * el.t * 2, py = sp.y + (H / 2 - sp.y) * el.t * 2;
        el.q.setLocalPosition((px - W / 2) * kd, (H / 2 - py) * kd, CAM_Z - FD);
        const grow = el.t === 0 ? 0.7 + 0.5 * Math.min(1, hs / 0.25) : 1;
        el.q.setLocalScale(el.w * kd * grow, el.h * kd * grow, 1);
        el.q.setLocalEulerAngles(0, 0, el.rot ? hs * 25 : 0);
        el.m.opacity = fa * (el.t === 0 ? 1 : 0.8); el.m.update();
      });
    }

    // wrist markers
    const hot = wristState?.arming != null;
    markers.forEach((q, i) => {
      const w = wristState?.wrists?.[i];
      q.enabled = !!w;
      if (!w) return;
      cam.camera.screenToWorld(w.x, w.y, MD, mpos);
      q.setPosition(mpos);
      const H = app.graphicsDevice.height / (window.devicePixelRatio || 1);
      const s = 104 * K * MD / CAM_Z * (1000 / H);
      q.setLocalScale(s, s, 1);
      q.setLocalEulerAngles(0, 0, (i ? -1 : 1) * time * (hot ? 160 : 30));
      q.q.render.meshInstances[0].material = hot || wristState.hover[i] ? markerHot : markerIdle;
    });
  });

  // wait two frames so every texture is on the GPU before declaring ready
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  window.__compReady = true;
}

build().catch((e) => { console.error(e); });
</script></body></html>
