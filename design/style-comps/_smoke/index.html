<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import * as pc from '../_shared/playcanvas.min.mjs';
import { createHands } from '../_shared/hands.mjs';
import { content, coverUrl } from '../_shared/content.mjs';
const canvas=document.getElementById('c');
const app=new pc.Application(canvas,{graphicsDeviceOptions:{antialias:true}});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW); app.setCanvasResolution(pc.RESOLUTION_AUTO); app.start();
const cam=new pc.Entity('cam'); cam.addComponent('camera',{clearColor:new pc.Color(.4,.7,.9)}); cam.setPosition(0,0,6); app.root.addChild(cam);
const light=new pc.Entity(); light.addComponent('light',{type:'directional'}); light.setEulerAngles(45,30,0); app.root.addChild(light);
const hands=createHands(app,cam);
const ball=new pc.Entity('hero'); ball.addComponent('render',{type:'sphere'}); ball.setLocalScale(1.5,1.5,1.5); app.root.addChild(ball);
const m=new pc.StandardMaterial(); m.diffuse=new pc.Color(1,1,1); m.update(); ball.render.meshInstances[0].material=m;
let selected=false;
hands.register('hero',ball,{onArm:p=>{m.emissive=new pc.Color(p,p,0);m.update();},onSelect:()=>{selected=true;m.diffuse=new pc.Color(0,1,0);m.update();window.__selected=true;}});
const tex=new pc.Texture(app.graphicsDevice); const img=new Image(); img.crossOrigin='anonymous';
img.onload=()=>{tex.setSource(img); m.diffuseMap=tex; m.update(); window.__coverLoaded=true; window.__compReady=true;};
img.onerror=()=>{console.error('cover failed '+img.src); window.__compReady=true;};
img.src=coverUrl(content.playlistOfTheDay.cover);
</script></body></html>
